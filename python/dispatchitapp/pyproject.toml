[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispatchitapp"
version = "1.0.0"
description = "Dispatch SDK for Python — error tracking and bug reports for the AI-native ticketing system."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Dispatch Team", email = "hello@dispatchit.app" }]
keywords = ["error-tracking", "bug-report", "monitoring", "dispatch"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://dispatchit.app"
Documentation = "https://dispatchit.app/docs"
Source = "https://github.com/Recursivity-LLC/dispatch-sdks"
Issues = "https://github.com/Recursivity-LLC/dispatch-sdks/issues"

# Framework adapters are opt-in extras (Phase 3). The core is stdlib-only, so a no-extras
# install is a viable manual-capture-only SDK (the gem's errors_only analogue).
[project.optional-dependencies]
django = ["django>=4.2"]
flask = ["flask>=2.0"]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
celery = ["celery>=5"]
dev = ["pytest>=7", "jsonschema>=4.18", "mypy>=1.8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/dispatchitapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient warns about httpx — test infrastructure, not our code.
    "ignore:Using `httpx`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"

# Runtime floor is 3.9 (ruff lints for it); mypy's minimum supported target is 3.10.
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# Optional framework deps — present only with their extras, and some ship no stubs.
[[tool.mypy.overrides]]
module = ["celery.*", "django.*", "flask.*", "starlette.*", "fastapi.*"]
ignore_missing_imports = true
